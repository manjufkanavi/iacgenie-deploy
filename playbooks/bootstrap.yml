---
# Bootstrap playbook: initial server setup
- hosts: all
  become: true
  become_method: sudo
  
  pre_tasks:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

  roles:
    - role: common
    - role: docker
    - role: user_management
    - role: ntp_config
