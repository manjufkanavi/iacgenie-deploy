---
# Post-deploy tasks: run after all containers are up
# Handles OpenBao auto-unseal and service readiness checks

- hosts: iacgenie-server
  become: true
  tasks:
    # --- OpenBao Auto-Unseal ---
    - name: "OpenBao | Wait for container to be healthy"
      ansible.builtin.command: docker inspect --format='{{ .State.Health.Status }}' iacgenie_openbao
      register: openbao_health
      retries: 20
      delay: 15
      until: openbao_health.stdout == 'healthy'
      changed_when: false
      failed_when: false

    - name: "OpenBao | Check if already unsealed"
      ansible.builtin.command: docker exec iacgenie_openbao bao operator list-seal-status
      register: openbao_seal_status
      changed_when: false
      failed_when: false
      ignore_errors: true

    - name: "OpenBao | Read unseal keys from init_keys.json"
      ansible.builtin.slurp:
        src: /home/mkanavi/docker/iacgenie/data/openbao_raft/init_keys.json
      register: openbao_keys_raw
      when:
        - openbao_health.stdout != 'healthy'
        - openbao_seal_status is failed

    - name: "OpenBao | Parse unseal keys"
      ansible.builtin.set_fact:
        openbao_unseal_keys: "{{ openbao_keys_raw.content | b64decode | from_json | json_query('unseal_keys_b64') }}"
      when:
        - openbao_keys_raw.content | default('') != ''
        - openbao_keys_raw.content is mapping

    - name: "OpenBao | Unseal OpenBao (each key)"
      ansible.builtin.command: >
        docker exec iacgenie_openbao bao operator unseal {{ item }}
      loop: "{{ openbao_unseal_keys }}"
      when:
        - openbao_unseal_keys is defined
        - openbao_unseal_keys | length > 0
      register: openbao_unseal_result
      changed_when: true

    - name: "OpenBao | Final health check after unseal"
      ansible.builtin.command: docker inspect --format='{{ .State.Health.Status }}' iacgenie_openbao
      register: openbao_final_health
      changed_when: false
      failed_when: false
      when: openbao_unseal_keys is defined

    - name: "OpenBao | Warn if unseal keys not found"
      ansible.builtin.debug:
        msg: "OpenBao unseal skipped — init_keys.json missing or empty. Manual unseal required."
      when:
        - openbao_keys_raw.content | default('') == ''
        - openbao_seal_status is failed

    # --- Service Readiness ---
    - name: "Keycloak | Wait for admin UI to be ready"
      ansible.builtin.uri:
        url: "http://127.0.0.1:8083/health/ready"
        status_code: 200
      register: keycloak_health
      retries: 30
      delay: 10
      changed_when: false
      failed_when: false
