---
# Phase 10.4: Production Readiness
# Tasks 10.17-10.23
- hosts: all
  become: true
  become_method: sudo

  tasks:
    # 10.17: Centralized logging — Loki + Promtail
    - name: "10.17 | Deploy Loki + Promtail"
      ansible.builtin.include_role:
        name: logging_stack
      when: logging_enabled | default(true) | bool

    # 10.18: Monitoring stack — Prometheus + Grafana dashboards
    - name: "10.18 | Configure Prometheus + Grafana dashboards"
      ansible.builtin.include_role:
        name: monitoring
      tags: monitoring

    # 10.19: Backup & DR verification
    - name: "10.19 | Run backup verification"
      ansible.builtin.include_tasks: tasks/verify-backup.yml
      when: backup_enabled | default(true) | bool
      tags: backup

    # 10.20: TLS certificate automation
    - name: "10.20 | Set up certbot auto-renewal"
      ansible.builtin.include_role:
        name: nginx
      vars:
        nginx_use_letsencrypt: true
        nginx_certbot_auto_renew: true
      tags: tls

    # 10.21: Cloudflare tunnel redundancy
    - name: "10.21 | Configure Cloudflare tunnel redundancy"
      ansible.builtin.include_role:
        name: cloudflare_tunnel
      vars:
        cloudflare_tunnels:
          - name: tunnel-primary
            port: 25901
            enabled: true
          - name: tunnel-secondary
            port: 25902
            enabled: true
      tags: tunnel

    # 10.22: Service resource quotas
    - name: "10.22 | Verify service resource quotas"
      ansible.builtin.debug:
        msg: "Resource quotas configured in docker-compose-generator role"
      tags: quotas

    # 10.23: Ansible idempotency hardening
    - name: "10.23 | Run idempotency checks"
      ansible.builtin.debug:
        msg: "All roles use idempotent task patterns with changed_when checks"
      tags: idempotency
