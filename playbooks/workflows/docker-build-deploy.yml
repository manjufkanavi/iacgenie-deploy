---
name: Docker Build + Deploy
on:
  push:
    branches: [ main ]

jobs:
  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate Docker Compose
        run: |
          echo "Validating docker-compose template..."
          grep -q 'version:' roles/docker-compose-generator/templates/docker-compose.yml.j2 || \
            echo "Template uses docker-compose format"

      - name: Pull latest base images
        run: |
          # Pre-pull common base images to speed up deployment
          docker pull postgres:16-alpine || echo "Postgres pull failed"
          docker pull redis:7-alpine || echo "Redis pull failed"
          docker pull minio/minio:latest || echo "MinIO pull failed"
          docker pull gitea/gitea:1.23.4-rootless || echo "Gitea pull failed"

      - name: Notify deployment start
        run: echo "Docker images validated and pre-pulled"

  deploy:
    name: Deploy to VM
    runs-on: ubuntu-latest
    needs: [docker-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via Ansible
        run: |
          echo "Deployment triggered from unified-infra repo"
          echo "Run: ansible-playbook playbooks/infrastructure.yml --limit iacgenie-deploy"
