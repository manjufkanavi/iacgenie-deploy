---
name: LightSerp CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: shrgr/actions-shellcheck@v2

      - name: Docker Compose Validate
        uses: isworthless/docker-compose-validate@v1.0.13
        with:
          composefile: roles/docker-compose-generator/templates/docker-compose.yml.j2

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Ansible Syntax Check
        run: |
          ansible-playbook --syntax-check roles/lightserp/tasks/main.yml

      - name: Jinja2 Validation
        run: |
          ls roles/lightserp/templates/*.j2 2>/dev/null | while read f; do
            echo "Validating $f"
          done

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Check LightSerp API
        run: |
          curl -sf -o /dev/null -w "%{http_code}" https://lightserv-api.iacgenie.com/ | grep -q "200" || echo "WARNING: LightSerp API not reachable"
      - name: Check LightSerp WebUI
        run: |
          curl -sf -o /dev/null -w "%{http_code}" https://lightserv.iacgenie.com/ | grep -q "200" || echo "WARNING: LightSerp WebUI not reachable"
