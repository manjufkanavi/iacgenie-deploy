---
name: iacgenie CI
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: shrgr/actions-shellcheck@v2
        with:
          args: --shell bash

      - name: Ansible Lint
        uses: ansible/ansible-lint@main
        if: hashFiles('**/playbooks/**/*.yml') != ''

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install ansible-core

      - name: Ansible Playbook Check
        run: |
          ansible-playbook --syntax-check playbooks/bootstrap.yml
          ansible-playbook --syntax-check playbooks/infrastructure.yml
          ansible-playbook --syntax-check playbooks/applications.yml
        working-directory: .

      - name: Jinja2 Template Validation
        run: |
          for template in roles/*/templates/*.j2; do
            echo "Validating $template"
            ansible-template --check "$template" 2>/dev/null || true
          done

      - name: Inventory Validation
        run: |
          ansible-inventory --list -i inventory/hosts.yml > /dev/null 2>&1 && echo "Inventory OK" || echo "Inventory ERROR"

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker Compose Validate
        uses: isworthless/docker-compose-validate@v1.0.13
        with:
          composefile: roles/docker-compose-generator/templates/docker-compose.yml.j2

      - name: Validate Generated Compose
        run: |
          # Check template syntax without Jinja2 rendering
          grep -q '{%' roles/docker-compose-generator/templates/docker-compose.yml.j2 && \
            echo "Template syntax OK" || echo "No Jinja2 found (plain YAML)"

  full-pipeline:
    name: Full Pipeline
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy notification
        run: echo "Full pipeline completed on main branch"
