---
# Services playbook: deploy all Docker services
- hosts: all
  become: true
  become_method: sudo
  
  roles:
    - role: postgresql
    - role: redis
    - role: minio
    - role: openbao
    - role: keycloak
    - role: keycloak_realm
    - role: gitea
    - role: lightserp
    - role: searxng
    - role: nsqd
    - role: pagezen
    - role: docker-compose-generator
    - role: docker-compose-service
    - role: nginx
    - role: cloudflare_tunnel

  # Post-deploy: wait for containers, unseal OpenBao, check readiness
  tasks:
    - import_tasks: roles/openbao/tasks/unseal.yml
      when:
        - not openbao_skip_unseal | default(false) | bool
    - import_tasks: roles/keycloak_realm/tasks/main.yml
      when:
        - keycloak_provision_realm | default(true) | bool
