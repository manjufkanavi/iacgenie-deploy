---
# Services playbook: deploy all Docker services
- hosts: all
  become: true
  become_method: sudo
  
  roles:
    - role: postgresql
    - role: redis
    - role: minio
    - role: openbao
    - role: keycloak
    - role: gitea
    - role: lightserp
    - role: searxng
    - role: nsqd
    - role: pagezen
    - role: docker-compose-generator
    - role: nginx
    - role: cloudflare_tunnel
