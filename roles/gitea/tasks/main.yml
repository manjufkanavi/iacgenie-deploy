---
# Gitea role - Main entry point
- name: "Gitea | Create data directory"
  ansible.builtin.file:
    path: "{{ gitea_data_dir | default('/var/lib/gitea') }}"
    owner: "100"
    group: "1000"
    mode: "0755"
    state: directory

- name: "Gitea | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart gitea

- name: "Gitea | Verify Gitea is running"
  ansible.builtin.command: docker compose -p iacgenie ps gitea
  register: gitea_status
  changed_when: false

- name: "Gitea | Show Gitea status"
  ansible.builtin.debug:
    var: gitea_status.stdout
