---
# Redis role - Main entry point
- name: "Redis | Create data directory"
  ansible.builtin.file:
    path: "{{ redis_data_dir }}"
    owner: redis
    group: redis
    mode: "0700"
    state: directory

- name: "Redis | Deploy Redis configuration"
  ansible.builtin.template:
    src: redis.conf.j2
    dest: /var/lib/redis/redis.conf
    owner: redis
    group: redis
    mode: "0600"
  notify: Restart redis

- name: "Redis | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart redis

- name: "Redis | Verify Redis is running"
  ansible.builtin.command: docker compose -p iacgenie ps redis
  register: redis_status
  changed_when: false

- name: "Redis | Show Redis status"
  ansible.builtin.debug:
    var: redis_status.stdout
