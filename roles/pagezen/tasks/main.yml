---
# PageZen role - Main entry point
- name: "PageZen | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart pagezen

- name: "PageZen | Verify PageZen is running"
  ansible.builtin.command: docker compose -p iacgenie ps pagezen
  register: pagezen_status
  changed_when: false

- name: "PageZen | Show PageZen status"
  ansible.builtin.debug:
    var: pagezen_status.stdout
