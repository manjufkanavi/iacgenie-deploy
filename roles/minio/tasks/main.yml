---
# MinIO role - Main entry point
- name: "MinIO | Create data directory"
  ansible.builtin.file:
    path: "{{ minio_data_dir | default('/var/lib/minio') }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: "MinIO | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart minio

- name: "MinIO | Verify MinIO is running"
  ansible.builtin.command: docker compose -p iacgenie ps minio
  register: minio_status
  changed_when: false

- name: "MinIO | Show MinIO status"
  ansible.builtin.debug:
    var: minio_status.stdout
