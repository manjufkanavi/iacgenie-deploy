---
# Docker Compose Generator role - Main entry point
- name: "Compose Gen | Generate Docker network"
  ansible.builtin.import_tasks: network.yml

- name: "Compose Gen | Generate docker-compose.yml"
  ansible.builtin.import_tasks: compose.yml

- name: "Compose Gen | Deploy compose file to target"
  ansible.builtin.import_tasks: deploy.yml
