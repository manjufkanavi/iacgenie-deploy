---
# SearXNG role - Main entry point
- name: "SearXNG | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart searxng

- name: "SearXNG | Verify SearXNG is running"
  ansible.builtin.command: docker compose -p iacgenie ps searxng
  register: searxng_status
  changed_when: false

- name: "SearXNG | Show SearXNG status"
  ansible.builtin.debug:
    var: searxng_status.stdout
