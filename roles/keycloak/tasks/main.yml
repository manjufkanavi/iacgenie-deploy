---
# Keycloak role - Main entry point
- name: "Keycloak | Create data directory"
  ansible.builtin.file:
    path: "{{ keycloak_data_dir | default('/var/lib/keycloak') }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: "Keycloak | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart keycloak

- name: "Keycloak | Verify Keycloak is running"
  ansible.builtin.command: docker compose -p iacgenie ps keycloak
  register: keycloak_status
  changed_when: false

- name: "Keycloak | Show Keycloak status"
  ansible.builtin.debug:
    var: keycloak_status.stdout
