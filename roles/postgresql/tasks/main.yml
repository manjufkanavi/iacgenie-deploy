---
# PostgreSQL role - Main entry point
- name: "PostgreSQL | Create data directory"
  ansible.builtin.file:
    path: "{{ pg_data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory

- name: "PostgreSQL | Deploy PostgreSQL configuration"
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: /var/lib/postgresql/data/postgresql.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql

- name: "PostgreSQL | Deploy pg_hba.conf"
  ansible.builtin.template:
    src: pg_hba.conf.j2
    dest: /var/lib/postgresql/data/pg_hba.conf
    owner: postgres
    group: postgres
    mode: "0600"
  notify: Restart postgresql

- name: "PostgreSQL | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart postgresql

- name: "PostgreSQL | Verify PostgreSQL is running"
  ansible.builtin.command: docker compose -p iacgenie ps postgres
  register: pg_status
  changed_when: false

- name: "PostgreSQL | Show PostgreSQL status"
  ansible.builtin.debug:
    var: pg_status.stdout
