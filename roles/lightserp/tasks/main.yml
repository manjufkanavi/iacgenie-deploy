---
# LightSerp role - Main entry point
- name: "LightSerp | Create config directory"
  ansible.builtin.file:
    path: /home/mkanavi/iacgenie-unified-infra/lightserp
    owner: mkanavi
    group: mkanavi
    mode: "0755"
    state: directory

- name: "LightSerp | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart lightserp-api

- name: "LightSerp | Verify LightSerp is running"
  ansible.builtin.command: docker compose -p iacgenie ps lightserp-api lightserp-webui
  register: lightserp_status
  changed_when: false

- name: "LightSerp | Show LightSerp status"
  ansible.builtin.debug:
    var: lightserp_status.stdout
