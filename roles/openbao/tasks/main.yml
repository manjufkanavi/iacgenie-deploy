---
# OpenBao role - Main entry point
- name: "OpenBao | Create data directory"
  ansible.builtin.file:
    path: "{{ openbao_data_dir }}"
    owner: root
    group: root
    mode: "0700"
    state: directory

- name: "OpenBao | Deploy environment file"
  ansible.builtin.template:
    src: .env.j2
    dest: /home/mkanavi/iacgenie-unified-infra/.env
    owner: mkanavi
    group: mkanavi
    mode: "0600"
  notify: Restart openbao

- name: "OpenBao | Verify OpenBao is running"
  ansible.builtin.command: docker compose -p iacgenie ps openbao
  register: openbao_status
  changed_when: false

- name: "OpenBao | Show OpenBao status"
  ansible.builtin.debug:
    var: openbao_status.stdout
